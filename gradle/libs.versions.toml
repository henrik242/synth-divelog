[versions]
# Build
agp = "9.4.1"
kotlin = "2.4.20"
composeMultiplatform = "1.12.1"
sqldelight = "2.4.1"

# Android SDK levels
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "33"

# AndroidX (android target only)
androidx-activityCompose = "1.13.0"
androidx-coreKtx = "1.19.1"

# androidx.navigationevent ships its own KMP targets; replaces the deprecated
# compose ui-backhandler.
androidx-navigationevent = "1.2.0"

# kotlinx -- first referenced in M1; versions re-verified when used
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
xmlutil = "1.0.2.1"

# Wired serial transports (M9)
usbSerialForAndroid = "3.11.0"
jserialcomm = "2.11.4"

# Git client for cloud sync (jvm + android)
jgit = "7.8.0.202609011348-r"

# Unified Compose map (Android, iOS, JVM desktop)
maplibreCompose = "0.19.0"

# Must match what SQLDelight's native-driver was built against; 1.4.0 breaks it at runtime on iOS.
sqliter = "1.3.3"

# Crash reporting (android only)
firebaseBom = "34.19.0"
googleServicesPlugin = "4.5.0"
crashlyticsPlugin = "3.0.8"

[libraries]
# kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# XML (formats)
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }

# Wired serial transports (M9): USB-serial on Android, jSerialComm on desktop
usbserial-android = { module = "com.github.mik3y:usb-serial-for-android", version.ref = "usbSerialForAndroid" }
jserialcomm = { module = "com.fazecast:jSerialComm", version.ref = "jserialcomm" }

# Git client (cloud sync on jvm + android)
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }

# MapLibre Compose: one Compose map across Android, iOS and desktop. The two
# runtime artifacts provide the native renderer per platform.
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibreCompose" }
maplibre-compose-runtime-opengl-android = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibreCompose" }
maplibre-compose-runtime-metal-macos-arm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-metal-macos-arm64", version.ref = "maplibreCompose" }

# SQLDelight drivers (wired in M1)
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# The SQLite library under the native driver; also opens foreign database files on iOS.
sqliter = { module = "co.touchlab:sqliter-driver", version.ref = "sqliter" }

# AndroidX (android only)
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-coreKtx" }
# Multiplatform back handling for the shared UI.
androidx-navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }

# Firebase (android only)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
# Captures native (MapLibre) crashes, which the JVM reporter misses.
firebase-crashlytics-ndk = { module = "com.google.firebase:firebase-crashlytics-ndk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
