name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

# The pushed commit, not github.sha: on a pull request that is GitHub's merge commit, which
# is on no branch. Stamps the version so it names a commit that can be looked up.
env:
  BUILD_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Common tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version is the commit count.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Configuring the Android modules needs the SDK location; the runner has the
      # SDK preinstalled and AGP provisions the compileSdk platform during the build.
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run common tests on the JVM
        run: ./gradlew jvmTest --stacktrace

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version is the commit count.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runner has the Android SDK preinstalled; AGP provisions the compileSdk
      # platform during the build, so no sdkmanager step is needed.
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # A debug build only needs a well-formed Firebase config, not the real one.
      - name: Create google-services.json
        run: cp .github/dummy/google-services-dummy.json app/android/google-services.json

      - name: Assemble debug APK
        run: ./gradlew :app:android:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          archive: false

  ios:
    name: iOS frameworks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version is the commit count.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: |
            /Users/runner/.konan/kotlin-native-prebuilt-*
            /Users/runner/.konan/dependencies
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # Configuring the KMP project needs the Android SDK location even for an iOS build.
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build shared iOS frameworks
        run: ./gradlew :ui:linkDebugFrameworkIosArm64 :ui:linkDebugFrameworkIosSimulatorArm64 --stacktrace

  macos:
    name: macOS desktop (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version is the commit count.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The map renders through the Java FFM API and jpackage needs a full JDK 25;
      # the Gradle toolchain (foojay resolver) downloads BellSoft Liberica 25 as configured.
      - name: Package DMG
        run: ./gradlew :app:desktop:packageDmg --stacktrace

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-desktop-dmg
          path: app/desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          archive: false

