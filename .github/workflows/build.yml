name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:android:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS app (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Xcode project links a prebuilt framework from ui/build/bin, so build it first.
      - name: Build shared framework
        run: ./gradlew :ui:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build app for simulator
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/SynthDivelog.app
          if-no-files-found: error

  macos:
    name: macOS desktop (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The map renders through the Java FFM API and jpackage needs a full JDK 25;
      # the Gradle toolchain (foojay resolver) downloads BellSoft Liberica 25 as configured.
      - name: Package DMG
        run: ./gradlew :app:desktop:packageDmg --stacktrace

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-dmg
          path: app/desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
