name: Release iOS

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      whats_new_en:
        description: "What's New (English)"
        required: true
        default: "Bug fixes and improvements."
      submit_for_review:
        description: "Submit for App Store review (uncheck to upload to TestFlight only)"
        type: boolean
        default: false

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: production
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history: the version is the commit count.
        fetch-depth: 0

    - name: Compute version tag
      id: version
      run: |
        VERSION_TAG="v$(git rev-list --count HEAD)"
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
        echo "Version tag: $VERSION_TAG ($SHORT_SHA)"
        echo "### iOS release $VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
        echo "Commit \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Validate secrets
      env:
        DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
        DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        ASC_CONTACT_FIRST_NAME: ${{ secrets.ASC_CONTACT_FIRST_NAME }}
        ASC_CONTACT_LAST_NAME: ${{ secrets.ASC_CONTACT_LAST_NAME }}
        ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
        ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
        SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
      run: |
        v=".github/verify-secret.sh"
        $v p12 DISTRIBUTION_CERTIFICATE_BASE64 "$DISTRIBUTION_CERTIFICATE_PASSWORD"
        $v mobileprovision PROVISIONING_PROFILE_BASE64
        $v nonempty ASC_KEY_ID
        $v nonempty ASC_ISSUER_ID
        $v p8 ASC_KEY_CONTENT
        $v base64 GOOGLE_SERVICE_INFO_PLIST
        # The App Review contact is only needed when submitting.
        if [ "$SUBMIT_FOR_REVIEW" = "true" ]; then
          $v nonempty ASC_CONTACT_FIRST_NAME
          $v nonempty ASC_CONTACT_LAST_NAME
          $v phone ASC_CONTACT_PHONE
          $v email ASC_CONTACT_EMAIL
        fi

    - name: Set up Ruby and fastlane
      uses: ruby/setup-ruby@v1.327.0
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-provider: basic

    - name: Cache Konan
      uses: actions/cache@v6
      with:
        path: |
          /Users/runner/.konan/kotlin-native-prebuilt-*
          /Users/runner/.konan/dependencies
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    # Configuring the KMP project needs the Android SDK location even for an iOS build.
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Run common tests on the JVM
      run: ./gradlew jvmTest

    - name: Decode signing assets
      env:
        DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        PROFILE_PATH=$RUNNER_TEMP/distribution.mobileprovision
        echo "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/distribution.p12"
        echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

        # fastlane imports the cert and installs the profile; it just needs the profile name
        PROFILE_PLIST=$(/usr/bin/security cms -D -i "$PROFILE_PATH")
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
        echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

    - name: Create GoogleService-Info.plist
      env:
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      run: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > iosApp/iosApp/GoogleService-Info.plist

    # The Xcode build phase runs :ui:embedAndSignAppleFrameworkForXcode itself.
    - name: Build and sign IPA
      env:
        OUTPUT_DIR: ${{ runner.temp }}/export
        DISTRIBUTION_CERTIFICATE_PATH: ${{ runner.temp }}/distribution.p12
        DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/distribution.mobileprovision
        FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60
      run: bundle exec fastlane ios build

    - name: Upload IPA and dSYMs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: release-ipa
        path: |
          ${{ runner.temp }}/export/SynthDivelog.ipa
          ${{ runner.temp }}/export/*.dSYM.zip
        if-no-files-found: warn
        retention-days: 90

    - name: Upload to App Store Connect
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        IPA_PATH: ${{ runner.temp }}/export/SynthDivelog.ipa
        ASC_CONTACT_FIRST_NAME: ${{ secrets.ASC_CONTACT_FIRST_NAME }}
        ASC_CONTACT_LAST_NAME: ${{ secrets.ASC_CONTACT_LAST_NAME }}
        ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
        ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
        WHATS_NEW_EN: ${{ inputs.whats_new_en }}
        SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
      run: |
        echo "$ASC_KEY_CONTENT" | base64 -d > "$ASC_KEY_PATH"
        bundle exec fastlane ios deploy

    - name: Create version tag and release ${{ steps.version.outputs.tag }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION_TAG="${{ steps.version.outputs.tag }}"
        IPA="$RUNNER_TEMP/synth-divelog-$VERSION_TAG.ipa"
        cp "$RUNNER_TEMP/export/SynthDivelog.ipa" "$IPA"
        git tag "$VERSION_TAG" 2>/dev/null || true
        git push origin "$VERSION_TAG" 2>/dev/null || true
        gh release view "$VERSION_TAG" &>/dev/null && \
          gh release upload "$VERSION_TAG" "$IPA" --clobber || \
          gh release create "$VERSION_TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION_TAG" \
            --notes "Release $VERSION_TAG" \
            "$IPA"

    - name: Cleanup secrets
      if: always()
      run: |
        security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
        rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/AuthKey.p8" iosApp/iosApp/GoogleService-Info.plist
