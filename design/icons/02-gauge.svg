<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00788F"/>
      <stop offset="1" stop-color="#00505E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- bezel ring -->
  <circle cx="512" cy="512" r="330" fill="#54D7F3"/>
  <circle cx="512" cy="512" r="284" fill="#003E4A"/>
  <!-- depth scale: 240deg sweep, gap at bottom -->
  <g stroke="#EAF9FD" stroke-linecap="round">
    <g stroke-width="20"><g transform="rotate(-120 512 512)"><line x1="512" y1="242" x2="512" y2="300"/></g></g>
    <g stroke-width="14"><g transform="rotate(-90 512 512)"><line x1="512" y1="252" x2="512" y2="296"/></g></g>
    <g stroke-width="14"><g transform="rotate(-60 512 512)"><line x1="512" y1="252" x2="512" y2="296"/></g></g>
    <g stroke-width="20"><g transform="rotate(-30 512 512)"><line x1="512" y1="242" x2="512" y2="300"/></g></g>
    <g stroke-width="14"><g transform="rotate(0 512 512)"><line x1="512" y1="252" x2="512" y2="296"/></g></g>
    <g stroke-width="14"><g transform="rotate(30 512 512)"><line x1="512" y1="252" x2="512" y2="296"/></g></g>
    <g stroke-width="20"><g transform="rotate(60 512 512)"><line x1="512" y1="242" x2="512" y2="300"/></g></g>
    <g stroke-width="14"><g transform="rotate(90 512 512)"><line x1="512" y1="252" x2="512" y2="296"/></g></g>
    <g stroke-width="20"><g transform="rotate(120 512 512)"><line x1="512" y1="242" x2="512" y2="300"/></g></g>
  </g>
  <!-- single needle into the deep range -->
  <g transform="rotate(75 512 512)">
    <path fill="#9C4332" d="M512 300 L534 512 L512 540 L490 512 Z"/>
  </g>
  <circle cx="512" cy="512" r="40" fill="#54D7F3"/>
  <circle cx="512" cy="512" r="17" fill="#003E4A"/>
</svg>
