<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00788F"/>
      <stop offset="1" stop-color="#00505E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- rising, expanding bubbles -->
  <g fill="#54D7F3">
    <circle cx="470" cy="376" r="158"/>
    <circle cx="624" cy="568" r="96"/>
    <circle cx="486" cy="712" r="58"/>
  </g>
  <!-- inner rim darkening to read as bubbles -->
  <g fill="none" stroke="#2BB7D8" stroke-width="18">
    <circle cx="470" cy="376" r="140"/>
    <circle cx="624" cy="568" r="84"/>
    <circle cx="486" cy="712" r="49"/>
  </g>
  <!-- specular highlights -->
  <g fill="#EAF9FD">
    <circle cx="416" cy="322" r="34"/>
    <circle cx="588" cy="532" r="21"/>
    <circle cx="466" cy="692" r="13"/>
  </g>
</svg>
